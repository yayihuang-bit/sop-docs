site_name: SOP 文件
site_url: https://yayihuang-bit.github.io/sop-docs/
theme:
  name: material
  language: zh-TW
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - navigation.expand
    - toc.integrate
    - search.suggest
    - search.highlight
  custom_dir: overrides

nav:
  - 首頁: index.md
  - 遊戲類教學:
    - 首頁: 遊戲上線工作_索引.md
    - 遊戲上線設定: 遊戲上線SOP.md
    - 遊戲調整流程: 遊戲調整流程.md
  - 營運活動教學:
    - 首頁: 營運_索引.md
    - 營運企劃執行工作大綱: 營運企劃執行工作大綱.md
    - 甘特圖轉換工具: 甘特圖轉換工具.md
    - 文案新增/調整流程: 文案調整.md
    - 營運文案寫法: 營運文案寫法.md
    - 後臺設定營運活動公告: 營運活動基本設定.md
    - 換皮資訊:
      - 首頁: 換皮資訊_索引.md
      - 代言人更新流程: 代言人更新流程.md
    - 抽獎:
      - 首頁: 抽獎_索引.md
      - 直播流程: 直播流程.md
      - 抽獎券推廣流程: 抽獎流程.md
      - 其他抽獎流程: 其他抽獎流程.md
  - 競品指南: 競品指南_索引.md
  - Git使用教學:
    - 首頁: Git使用教學_索引.md
    - 文件格式教學: 文件格式教學_索引.md
    - 版本推送與衝突處理: Git版本推送與衝突處理.md
    - 如何使用GIT: 如何使用GIT.md
  - 其他文件教學:
    - BUG回報方式: BUG回報方式.md
    - 友善遊戲: 友善遊戲.md

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: zh
  - macros

