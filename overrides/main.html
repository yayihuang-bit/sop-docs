{% extends "base.html" %}

{% block content %}
  {{ super() }}
{% endblock %}

{% block styles %}
  {{ super() }}
  <style>
    /* ════ 顏色變數 ════ */
    :root {
      --primary: #1a73e8;
      --primary-light: #e8f0fe;
      --warn-bg: #fff8e1;
      --warn-border: #f9a825;
      --tip-bg: #e8f5e9;
      --tip-border: #43a047;
      --code-bg: #f5f5f5;
      --border: #e0e0e0;
      --text: #202124;
      --text-muted: #5f6368;
    }

    /* ════ 隱藏 MkDocs 自動產生的頁面 H1 標題 ════ */
    .md-content__inner > h1 {
      display: none !important;
    }

    /* ════ 縮小 h2 頂部空隙 ════ */
    .md-typeset h2 {
      margin-top: 12px !important;
    }
    .md-typeset blockquote {
      margin-bottom: 12px !important;
    }

    /* ════ MkDocs 基礎樣式美化 ════ */
    .md-typeset {
      color: var(--text);
    }

    .md-typeset h1, .md-typeset h2, .md-typeset h3, .md-typeset h4, .md-typeset h5, .md-typeset h6 {
      color: var(--text);
    }

    .md-typeset h2 {
      border-bottom: 2px solid var(--primary);
      color: var(--primary);
    }

    .md-typeset a {
      color: var(--primary);
      text-decoration: none;
    }

    .md-typeset a:hover {
      text-decoration: underline;
    }

    /* ════ 表格美化 ════ */
    .md-typeset table {
      border-collapse: collapse;
      margin: 14px 0;
      font-size: 14px;
      width: 100%;
    }

    .md-typeset thead th {
      background: var(--primary);
      color: #fff;
      padding: 9px 12px;
      text-align: left;
      font-weight: 600;
      border: none;
    }

    .md-typeset td {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }

    .md-typeset tbody tr:nth-child(even) {
      background-color: #f8f9fa;
    }

    .md-typeset tbody tr:hover {
      background-color: var(--primary-light);
    }

    /* ════ 程式碼塊美化 ════ */
    .md-typeset code {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      color: var(--text);
      font-family: "Consolas", "Monaco", monospace;
    }

    .md-typeset pre {
      background: #1e1e1e;
      color: #d4d4d4;
      border-radius: 8px;
      padding: 18px 20px;
      overflow-x: auto;
      margin: 14px 0;
      font-size: 13px;
      line-height: 1.6;
    }

    .md-typeset pre code {
      background: none;
      border: none;
      padding: 0;
      color: inherit;
    }

    /* ════ 引用和特殊框 ════ */
    .md-typeset blockquote {
      border-left: 4px solid var(--warn-border);
      background: var(--warn-bg);
      padding: 10px 14px;
      border-radius: 0 6px 6px 0;
      margin: 14px 0;
      font-size: 14px;
    }

    /* ════ 提示框（綠色） ════ */
    .md-typeset .admonition.tip,
    .md-typeset .admonition.hint,
    .md-typeset .admonition.note {
      border-left: 4px solid var(--tip-border);
      background: var(--tip-bg);
    }

    /* ════ 警告框（黃色） ════ */
    .md-typeset .admonition.warning,
    .md-typeset .admonition.caution,
    .md-typeset .admonition.attention {
      border-left: 4px solid var(--warn-border);
      background: var(--warn-bg);
    }

    /* ════ 隱藏左側導航（僅桌機） ════ */
    @media (min-width: 1221px) {
      .md-sidebar--primary {
        display: none !important;
      }
    }

    /* ════ 隱藏漢堡選單按鈕（僅桌機） ════ */
    @media (min-width: 1221px) {
      .md-header__button[for="__drawer"] {
        display: none !important;
      }
    }

    .md-content {
      margin-left: 0 !important;
    }

    .md-content__inner {
      max-width: none !important;
    }

    .md-typeset {
      max-width: none !important;
    }

    /* ════ 平板版（1024px - 1220px） ════ */
    @media (max-width: 1220px) and (min-width: 768px) {
      .md-sidebar--primary {
        width: 70vw !important;
        max-width: 280px !important;
      }
    }

    /* ════ 手機版（小於 768px） ════ */
    @media (max-width: 768px) {
      .md-sidebar--primary {
        width: 65vw !important;
        max-width: 240px !important;
      }
    }

    /* ════ 超小手機（480px 以下） ════ */
    @media (max-width: 480px) {
      .md-sidebar--primary {
        width: 60vw !important;
        max-width: 200px !important;
      }
    }

    /* ════ 菜單打開時覆蓋效果 ════ */
    @media (max-width: 1220px) {
      #__drawer:checked ~ .md-overlay {
        display: block !important;
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        z-index: 8 !important;
        background-color: rgba(0, 0, 0, 0.5) !important;
      }

      .md-sidebar--primary {
        z-index: 9 !important;
      }
    }

  </style>
{% endblock %}

{% block scripts %}
  {{ super() }}
  <script>
    // ════ 我的常用連結（每人存自己瀏覽器，不同人不同份，依來源分類）════
    var CATEGORY_ORDER = ['遊戲類教學', '營運活動教學', '競品指南', '其他'];
    var CATEGORY_COLORS = {
      '遊戲類教學': { fg: '#7c6a9c', bg: '#f2f0f5' },
      '營運活動教學': { fg: '#a8734f', bg: '#f7f0e8' },
      '競品指南': { fg: '#6f8f76', bg: '#eff4f0' },
      '其他': { fg: '#888', bg: '#f2f2f2' }
    };
    // 依網址路徑判斷這頁屬於首頁哪個大分類（跟 mkdocs.yml 的 nav 分類對應）
    function getPageCategory(){
      var path = decodeURIComponent(location.pathname);
      if(/\/遊戲/.test(path)) return '遊戲類教學';
      if(/\/(營運|換皮|抽獎|直播|其他抽獎)/.test(path)) return '營運活動教學';
      if(/\/競品/.test(path)) return '競品指南';
      return '其他';
    }

    var DEFAULT_FAVORITES = [
      { text: '包你發更新計畫表', href: '{{ config.extra.links.update_plan_sheet }}', category: '遊戲類教學' },
      { text: '營運文件總覽', href: '{{ config.extra.links.campaign_doc_sheet }}', category: '營運活動教學' },
      { text: '抽獎券規劃表', href: '{{ config.extra.links.ticket_planning_sheet }}', category: '營運活動教學' },
      { text: '營運自動化文件表', href: '{{ config.extra.links.ops_automation_sheet }}', category: '營運活動教學' }
    ];
    var FAVORITES_KEY = 'sop_favorites';
    function loadFavorites(){
      try {
        var raw = localStorage.getItem(FAVORITES_KEY);
        if(raw === null) return DEFAULT_FAVORITES.slice();
        var list = JSON.parse(raw);
        // 相容舊資料（分類功能上線前存的）：先試著用網址比對預設清單補回分類，比對不到才歸到「其他」
        list.forEach(function(f){
          if(f.category) return;
          var match = DEFAULT_FAVORITES.find(function(d){ return d.href === f.href; });
          f.category = match ? match.category : '其他';
        });
        return list;
      } catch(e){ return DEFAULT_FAVORITES.slice(); }
    }
    function saveFavorites(list){
      try { localStorage.setItem(FAVORITES_KEY, JSON.stringify(list)); } catch(e){}
    }
    function isFavorited(href){
      var list = loadFavorites();
      for(var i=0;i<list.length;i++){ if(list[i].href === href) return true; }
      return false;
    }
    function toggleFavorite(href, text, category){
      var list = loadFavorites();
      var idx = -1;
      for(var i=0;i<list.length;i++){ if(list[i].href === href){ idx = i; break; } }
      if(idx === -1) list.push({ href: href, text: text, category: category || getPageCategory() });
      else list.splice(idx, 1);
      saveFavorites(list);
      return list;
    }

    function initPasswordProtection(){
      if (localStorage.getItem('sop_authenticated') !== 'true') {
        var overlay = document.createElement('div');
        overlay.id = 'pwd-overlay';
        overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:10001;display:flex;align-items:center;justify-content:center;';

        var box = document.createElement('div');
        box.style.cssText = 'background:white;padding:40px;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,0.3);text-align:center;';

        box.innerHTML = '<h2 style="margin:0 0 20px 0;color:#333;">需要密碼</h2><input id="pwd-input" type="password" placeholder="請輸入密碼" style="padding:10px;font-size:16px;width:200px;border:1px solid #ccc;border-radius:4px;"><button style="margin-left:10px;padding:10px 20px;background:#007bff;color:white;border:none;border-radius:4px;cursor:pointer;font-size:16px;">確認</button>';

        overlay.appendChild(box);
        document.body.appendChild(overlay);

        var pwdInput = document.getElementById('pwd-input');
        pwdInput.focus();

        function checkPwd(){
          if(pwdInput.value === 'asd12345'){
            localStorage.setItem('sop_authenticated', 'true');
            overlay.remove();
            initFlyGif();
          } else {
            alert('密碼錯誤');
            pwdInput.value = '';
            pwdInput.focus();
          }
        }

        box.querySelector('button').onclick = checkPwd;
        pwdInput.onkeypress = function(e){ if(e.key === 'Enter') checkPwd(); };
      } else {
        initFlyGif();
      }
    }

    var FLY_GIFS = [
      'https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExb3Btc3FseWdtNmhueTl0Ym5xcnN6dzI0NWxpaXJmbWk1YWt4NXc4dCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/TucOQxQkfvRhY3TiwT/giphy.gif',
      'https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExYTk2OThsY2JpcTlkdDZvdHdnbzY0ODg4NmlwMzFjZW9ydXR6amxqdiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cQmpHM5Rh64iGDQB75/giphy.gif',
      'https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExbzB2aHl5M3ZpNDJrZGZyYWJndW44ajc3aHVqaTI5bnI2ODAwcmp1YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/2l8BqseoXKPUQMjezi/giphy.gif',
      'https://media1.giphy.com/media/v1.Y2lkPTc5MGI3NjExcTl6Y3FicmNqMDZ3Znp0Mm01MnJ3OXRlb3g5emh5MTN1ZTZkdzVqZyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/UpxdwjZ5kXyJcTnbq0/giphy.gif',
      'https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExZzNubXN1YXgzeDE4d2tuZ3J0eXl5enkwZjNtNHg1cjVhdmtmZjJsdCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/HLZuyghzXHvbAvUSwr/giphy.gif',
      'https://media3.giphy.com/media/KOrIxsEQaBJcHgiiqL/giphy.gif'
    ];
    var FLY_MAX = 1;
    var _flyCount = 0;
    var _flyScheduleTimeout = null;

    FLY_GIFS.forEach(function(u){ new Image().src = u; });

    function initFlyGif() {

      function triggerFlyGif(){
        if(_flyCount >= FLY_MAX) return;
        _flyCount++;
        var gif = FLY_GIFS[Math.floor(Math.random() * FLY_GIFS.length)];
        var topPct = (5 + Math.random() * 85) + '%';
        var dur = (2.5 + Math.random() * 5).toFixed(1) + 's';
        var size = (100 + Math.random() * 180) + 'px';
        var el = document.createElement('img');
        el.src = gif;
        var startTop = parseFloat(topPct);
        el.style.cssText = 'position:fixed;right:-200px;top:'+topPct+';width:'+size+';height:auto;z-index:500;pointer-events:all;cursor:grab;border:none;outline:none;box-shadow:none;background:transparent;';
        document.body.appendChild(el);
        var _durMs = parseFloat(dur) * 1000;
        var _startTime = Date.now();
        var _waveAmp = 8 + Math.random() * 12;
        var _waveFreq = 1.5 + Math.random() * 2;
        var _flyRaf = null;
        var _dragging = false;
        function animateFly(){
          if(_dragging){ _flyRaf = requestAnimationFrame(animateFly); return; }
          var elapsed = Date.now() - _startTime;
          var progress = elapsed / _durMs;
          if(progress >= 1){
            if(el.parentNode){el.parentNode.removeChild(el); _flyCount--;}
            scheduleFlyGif();
            return;
          }
          var x = (1 - progress) * (window.innerWidth + 200) - 200;
          el.style.right = 'auto';
          el.style.left = x + 'px';
          var topVal = startTop + Math.sin(progress * Math.PI * 2 * _waveFreq) * _waveAmp;
          el.style.top = topVal + '%';
          _flyRaf = requestAnimationFrame(animateFly);
        }
        el.onmousedown = function(){ _dragging = true; };
        el.onmouseup = function(){ _dragging = false; };
        el.onmouseleave = function(){ _dragging = false; };
        animateFly();
      }

      function scheduleFlyGif(){
        if(document.hidden) return;
        if(_flyScheduleTimeout) clearTimeout(_flyScheduleTimeout);
        _flyScheduleTimeout = setTimeout(function(){
          if(!document.hidden){
            triggerFlyGif();
          }
        }, (30 + Math.random() * 60) * 1000);
      }

      document.addEventListener('visibilitychange', function(){
        if(document.hidden){
          if(_flyScheduleTimeout) clearTimeout(_flyScheduleTimeout);
        } else {
          scheduleFlyGif();
        }
      });

      if(!/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) && window.innerWidth >= 1024){
        scheduleFlyGif();
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initPasswordProtection);
    } else {
      initPasswordProtection();
    }

    // 修正回到頂部按鈕：只滑到頂部，不打開目錄
    document.addEventListener('DOMContentLoaded', function(){
      var backToTopBtn = document.querySelector('.md-top');
      if(backToTopBtn){
        backToTopBtn.addEventListener('click', function(e){
          e.preventDefault();
          e.stopPropagation();
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return false;
        });
      }
    });

    // ════ 自動排序卡片（根據點擊紀錄）════
    (function(){
      var KEY = 'sop_clicks';
      function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ return {}; } }
      function inc(href){ var c=load(); c[href]=(c[href]||0)+1; localStorage.setItem(KEY,JSON.stringify(c)); }

      function sortPage(){
        var counts = load();
        var inner = document.querySelector('.md-content__inner');
        if(!inner) return;

        // 只有索引頁（有 grid 卡片）才執行排序
        if(!inner.querySelector('div[style*="display:grid"]')) return;

        // 收集各分類區塊（h2 + 後續元素，到下一個 h2 或 hr 為止）
        var allNodes = Array.from(inner.children);
        var sections = [];
        var i = 0;
        while(i < allNodes.length){
          var node = allNodes[i];
          if(node.tagName === 'H2'){
            // 「我的常用連結」固定釘在最前面，不參與點擊排序
            var isPinned = node.textContent.indexOf('我的常用連結') !== -1;
            var sec = { nodes:[node], total:0 };
            i++;
            while(i < allNodes.length && allNodes[i].tagName !== 'H2' && allNodes[i].tagName !== 'HR'){
              var child = allNodes[i];
              sec.nodes.push(child);
              child.querySelectorAll('a[href]').forEach(function(a){
                sec.total += (counts[a.getAttribute('href')]||0);
              });
              i++;
            }
            if(i < allNodes.length && allNodes[i].tagName === 'HR') i++; // 跳過 hr
            if(!isPinned) sections.push(sec);
          } else { i++; }
        }

        // 依點擊數排序分類區塊
        if(sections.length >= 2){
          sections.sort(function(a,b){ return b.total - a.total; });
          sections.forEach(function(sec, idx){
            sec.nodes.forEach(function(n){ inner.appendChild(n); });
            if(idx < sections.length-1){
              var hr = document.createElement('hr');
              inner.appendChild(hr);
            }
          });
        }

        // 依點擊數排序每個 grid 內的卡片
        inner.querySelectorAll('div[style*="display:grid"]').forEach(function(grid){
          var cards = Array.from(grid.children);
          if(cards.length < 2) return;
          cards.sort(function(a,b){
            var aEl = a.querySelector('a[href]');
            var bEl = b.querySelector('a[href]');
            var aKey = aEl ? aEl.getAttribute('href') : '';
            var bKey = bEl ? bEl.getAttribute('href') : '';
            return (counts[bKey]||0) - (counts[aKey]||0);
          });
          cards.forEach(function(c){ grid.appendChild(c); });
        });
      }

      function addTracking(){
        document.querySelectorAll('.md-content__inner a[href]').forEach(function(a){
          a.addEventListener('click', function(){ inc(this.getAttribute('href')); });
        });
      }

      document.addEventListener('DOMContentLoaded', function(){ sortPage(); addTracking(); });
    })();

    // ════ 自動連結彙整（文章頁自動生成）════
    (function(){
      // 連結文字太籠統的不列入（會看不懂是什麼）
      var GENERIC = ['參考', '這裡', '查看', '點此', '連結', '簡報'];
      var GROUP_ORDER = ['站內文件', '試算表', '簡報', '雲端資料夾', 'Slack 群組', '其他'];

      function build(){
        var inner = document.querySelector('.md-content__inner');
        if(!inner) return;
        // 索引頁（grid 卡片）不生成
        if(inner.querySelector('div[style*="display:grid"]')) return;

        var groups = {};
        GROUP_ORDER.forEach(function(g){ groups[g] = []; });
        var seen = {};
        var count = 0;

        inner.querySelectorAll('a[href]').forEach(function(a){
          var raw = a.getAttribute('href') || '';
          if(raw.charAt(0) === '#' || raw.indexOf('mailto:') === 0) return;
          var text = (a.textContent || '').trim();
          if(!text || text.charAt(0) === '←') return;
          if(GENERIC.indexOf(text) !== -1) return;
          if(seen[a.href]) return;
          seen[a.href] = true;

          var g;
          if(a.host === location.host) g = '站內文件';
          else if(a.href.indexOf('docs.google.com/spreadsheets') !== -1) g = '試算表';
          else if(a.href.indexOf('docs.google.com/presentation') !== -1) g = '簡報';
          else if(a.href.indexOf('drive.google.com') !== -1) g = '雲端資料夾';
          else if(a.href.indexOf('slack.com') !== -1) g = 'Slack 群組';
          else g = '其他';
          groups[g].push({ text: text, href: a.href, external: a.host !== location.host });
          count++;
        });

        if(count === 0) return;

        var h2 = document.createElement('h2');
        h2.id = 'link-summary';
        h2.textContent = '連結彙整';
        var note = document.createElement('span');
        note.style.cssText = 'font-size:16px; font-weight:400; color:#888; margin-left:10px;';
        note.textContent = '（自動彙整內文連結，「參考」「這裡」等籠統命名不列入）';
        h2.appendChild(note);

        var table = document.createElement('table');
        table.style.cssText = 'width:100%; table-layout:fixed;';
        var thead = document.createElement('thead');
        thead.innerHTML = '<tr><th style="width:18%">分類</th><th style="width:82%">連結</th></tr>';
        table.appendChild(thead);
        var tbody = document.createElement('tbody');
        GROUP_ORDER.forEach(function(g){
          if(!groups[g].length) return;
          var tr = document.createElement('tr');
          var td1 = document.createElement('td');
          td1.textContent = g;
          var td2 = document.createElement('td');
          groups[g].forEach(function(item, idx){
            if(idx > 0) td2.appendChild(document.createTextNode('、'));
            var link = document.createElement('a');
            link.href = item.href;
            link.textContent = item.text;
            if(item.external) link.target = '_blank';
            td2.appendChild(link);

            var star = document.createElement('span');
            star.textContent = isFavorited(item.href) ? '★' : '☆';
            star.title = '加入／移除我的常用連結';
            star.style.cssText = 'cursor:pointer; margin-left:2px; margin-right:6px; user-select:none; color:#a8734f;';
            star.addEventListener('click', function(){
              toggleFavorite(item.href, item.text);
              star.textContent = isFavorited(item.href) ? '★' : '☆';
            });
            td2.appendChild(star);
          });
          tr.appendChild(td1);
          tr.appendChild(td2);
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);

        // 插在版本資訊（第一個 blockquote）後面，找不到就插在最前面
        var bq = inner.querySelector(':scope > blockquote');
        if(bq){
          bq.parentNode.insertBefore(table, bq.nextSibling);
          bq.parentNode.insertBefore(h2, table);
        } else {
          inner.insertBefore(table, inner.firstChild);
          inner.insertBefore(h2, table);
        }
      }

      document.addEventListener('DOMContentLoaded', build);
    })();

    // ════ 首頁「我的常用連結」渲染 ════
    (function(){
      function renderFavorites(){
        var container = document.getElementById('my-favorites-list');
        if(!container) return;

        var list = loadFavorites();
        container.innerHTML = '';

        if(!list.length){
          var empty = document.createElement('p');
          empty.style.cssText = 'color:#888; font-size:14px;';
          empty.textContent = '目前沒有常用連結，逛其他頁面時可以點連結旁的 ☆ 加入。';
          container.appendChild(empty);
          return;
        }

        // 依來源分類分組
        var groups = {};
        CATEGORY_ORDER.forEach(function(c){ groups[c] = []; });
        list.forEach(function(item){
          var c = item.category && groups[item.category] ? item.category : '其他';
          groups[c].push(item);
        });

        CATEGORY_ORDER.forEach(function(cat){
          if(!groups[cat].length) return;
          var colors = CATEGORY_COLORS[cat];

          var h3 = document.createElement('h3');
          h3.textContent = cat;
          h3.style.cssText = 'color:' + colors.fg + '; margin:16px 0 8px 0; font-size:16px;';
          container.appendChild(h3);

          var wrap = document.createElement('div');
          wrap.style.cssText = 'display:flex; flex-wrap:wrap; gap:10px; margin-bottom:8px;';

          groups[cat].forEach(function(item){
            var chip = document.createElement('span');
            chip.style.cssText = 'display:inline-flex; align-items:center; gap:8px; border:1px solid ' + colors.fg + '; border-radius:20px; padding:6px 10px 6px 16px; background:' + colors.bg + ';';

            var a = document.createElement('a');
            a.href = item.href;
            a.textContent = item.text;
            try {
              var isExternal = new URL(item.href, location.href).host !== location.host;
              if(isExternal) a.target = '_blank';
            } catch(e){}
            a.style.cssText = 'color:' + colors.fg + '; font-weight:600; text-decoration:none;';

            var remove = document.createElement('span');
            remove.textContent = '✕';
            remove.title = '移除這個常用連結';
            remove.style.cssText = 'cursor:pointer; color:#999; font-size:12px; padding:2px;';
            remove.addEventListener('click', function(){
              toggleFavorite(item.href, item.text, item.category);
              renderFavorites();
            });

            chip.appendChild(a);
            chip.appendChild(remove);
            wrap.appendChild(chip);
          });

          container.appendChild(wrap);
        });
      }

      document.addEventListener('DOMContentLoaded', renderFavorites);
    })();

    // ════ 表格儲存格：一行放得下就不換行，放不下才換行（依欄位實際可用寬度判斷）════
    // 註：table-layout:fixed 底下，「同一欄」所有儲存格共用同一個欄寬——只要欄內
    // 有一格文字很長把欄撐寬，同欄其他短格的 scrollWidth 量到的也是那個被撐寬後的
    // 欄寬，不是它自己文字真正的寬度，導致直接量儲存格會誤判。
    // 解法：用一個隱藏的量尺 <span>（不受表格版面影響）分別量每一格文字「自己」
    // 不換行時的真實寬度，再跟這一欄依 % 換算出的實際可用寬度比較。
    (function(){
      function autoWrapCells(){
        var probe = document.createElement('span');
        probe.style.cssText = 'position:absolute; visibility:hidden; white-space:nowrap; top:-9999px; left:-9999px;';
        document.body.appendChild(probe);

        document.querySelectorAll('.md-typeset table').forEach(function(table){
          var wrap = table.closest('.md-typeset__scrollwrap');
          var containerWidth = wrap ? wrap.clientWidth : table.parentElement.clientWidth;
          if(!containerWidth) return;

          var headerCells = table.querySelectorAll('thead th');
          var fractions = [];
          headerCells.forEach(function(th){
            var w = th.style.width;
            fractions.push(w && w.indexOf('%') !== -1 ? parseFloat(w) / 100 : null);
          });

          var rows = table.querySelectorAll('tbody tr');
          rows.forEach(function(row){
            var tds = row.children;
            for(var i = 0; i < tds.length; i++){
              var td = tds[i];
              var frac = fractions[i] || (1 / tds.length);
              var targetPx = containerWidth * frac;

              var cs = getComputedStyle(td);
              probe.style.fontSize = cs.fontSize;
              probe.style.fontFamily = cs.fontFamily;
              probe.style.fontWeight = cs.fontWeight;
              probe.style.letterSpacing = cs.letterSpacing;
              probe.innerHTML = td.innerHTML;

              var naturalWidth = probe.scrollWidth + (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
              td.style.whiteSpace = (naturalWidth > targetPx + 2) ? 'normal' : 'nowrap';
            }
          });
        });

        document.body.removeChild(probe);
      }

      var resizeTimer = null;
      function scheduleAutoWrap(){
        if(resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(autoWrapCells, 150);
      }

      document.addEventListener('DOMContentLoaded', autoWrapCells);
      window.addEventListener('resize', scheduleAutoWrap);
    })();
  </script>
  </script>
